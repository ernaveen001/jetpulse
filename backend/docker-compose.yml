version: '3.8'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - USE_SQLITE_FALLBACK=False
      - DATABASE_URL=postgres://jetpulse_user:jetpulse_pass@db:5432/jetpulse_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=jetpulse_db
      - POSTGRES_USER=jetpulse_user
      - POSTGRES_PASSWORD=jetpulse_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  celery:
    build: .
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - USE_SQLITE_FALLBACK=False
      - DATABASE_URL=postgres://jetpulse_user:jetpulse_pass@db:5432/jetpulse_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    command: celery -A config beat --loglevel=info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - USE_SQLITE_FALLBACK=False
      - DATABASE_URL=postgres://jetpulse_user:jetpulse_pass@db:5432/jetpulse_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
