    <!-- Schema.org Rich Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": ["Organization", "MedicalBusiness"],
            "@id": "https://www.jetpulse.in/#organization",
            "name": "JetPulse",
            "alternateName": "JetPulse Healthcare",
            "url": "https://www.jetpulse.in/",
            "logo": "https://www.jetpulse.in/logo.png",
            "image": "https://www.jetpulse.in/og-image.png",
            "description": "Intelligent healthcare companion booking, hospital OPD navigation, diagnostic visit escorts, and connected family health ecosystem.",
            "priceRange": "₹₹",
            "currenciesAccepted": "INR",
            "paymentAccepted": "Cash, Credit Card, UPI, Net Banking",
            "areaServed": [
              { "@type": "City", "name": "Bangalore" },
              { "@type": "City", "name": "Varanasi" },
              { "@type": "City", "name": "Jaipur" },
              { "@type": "City", "name": "Delhi NCR" },
              { "@type": "City", "name": "Mumbai" },
              { "@type": "City", "name": "Hyderabad" },
              { "@type": "Country", "name": "India" }
            ],
            "hasOfferCatalog": {
              "@type": "OfferCatalog",
              "name": "JetPulse Healthcare Services",
              "itemListElement": [
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Healthcare Companion Service",
                    "description": "Trained, verified companion for doctor appointments, doorstep pickup, mobility escort, and visit notes."
                  }
                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Hospital Navigation Assistance",
                    "description": "Hospital OPD registration guidance, token queues, ward navigation, and TPA insurance paperwork help."
                  }
                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Diagnostic Test Assistance",
                    "description": "Assistance for MRI scans, blood work, ultrasound, and radiology appointments with file organization."
                  }
                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Post-Discharge Care Support",
                    "description": "Safe doorstep transport home, pharmacy medication pickup, and home recovery setup assistance."
                  }
                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "AI Care Navigator",
                    "description": "Smart symptom triage, prescription scanning, and specialist/hospital recommendation engine."
                  }
                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Family Health Ecosystem",
                    "description": "Centralized private health timeline for multi-city family appointment and report coordination."
                  }
                }
              ]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://www.jetpulse.in/#website",
            "url": "https://www.jetpulse.in/",
            "name": "JetPulse Healthcare",
            "publisher": { "@id": "https://www.jetpulse.in/#organization" },
            "inLanguage": "en-IN",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://www.jetpulse.in/care-navigator?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "FAQPage",
            "@id": "https://www.jetpulse.in/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What is JetPulse?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "JetPulse is a comprehensive healthcare companion platform providing verified physical escorts for doctor visits, hospital navigation, diagnostic tests, and post-discharge care, powered by an AI Care Navigator and a synchronized family health ecosystem."
                }
              },
              {
                "@type": "Question",
                "name": "How does booking a healthcare companion work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "You can book instant or scheduled assistance through the JetPulse platform. A background-verified, trained companion arrives at your doorstep or hospital, helps with mobility, tokens, queues, and documentation, and sends live updates to authorized family members."
                }
              },
              {
                "@type": "Question",
                "name": "Can I book a companion for my parents living in another city?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes! JetPulse is built for remote family care coordination. You can book from Bangalore, the US, or anywhere for loved ones in Varanasi, Jaipur, Bangalore, Delhi, and other cities, tracking their care journey with live milestones in real time."
                }
              },
              {
                "@type": "Question",
                "name": "Are JetPulse services non-clinical or medical?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "JetPulse companions provide non-clinical mobility, navigation, emotional reassurance, and administrative assistance. JetPulse does not provide clinical diagnosis or emergency treatments."
                }
              }
            ]
          }
        ]
      }
